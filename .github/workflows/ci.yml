name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build shared package
        run: npm run build -w @ordercheck/shared

      - name: Generate Prisma client
        run: npm run prisma:generate -w @ordercheck/api

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -w @ordercheck/shared -w @ordercheck/api -w @ordercheck/vision

      - name: Build
        run: npm run build -w @ordercheck/api -w @ordercheck/vision -w @ordercheck/web
